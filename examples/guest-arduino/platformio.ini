[env:guest-arduino]
platform = espressif32 @ 6.12.0
framework = arduino
board = esp32s3box
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    symlink://../..
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.16
extra_scripts = pre:tools/upload_guard.py
custom_allow_full_upload = no

[env:host-arduino]
extends = env:guest-arduino
build_flags =
    ${env:guest-arduino.build_flags}
    -DMULTIFIRM_HOST=1
