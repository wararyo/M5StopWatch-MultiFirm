[env:guest-espidf]
platform = espressif32 @ 6.12.0
framework = espidf
board = m5stack-cores3
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DMULTIFIRM_PLATFORMIO=ON
monitor_speed = 115200
lib_deps =
    symlink://../..
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.16
build_flags =
    -DBOARD_HAS_PSRAM
    -Wno-error=maybe-uninitialized
extra_scripts = pre:tools/upload_guard.py
custom_allow_full_upload = no

[env:host-espidf]
extends = env:guest-espidf
build_flags =
    ${env:guest-espidf.build_flags}
    -DMULTIFIRM_HOST=1
